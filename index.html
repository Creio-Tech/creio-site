  <meta property="og:title" content="Creio">

  <style>
    :root {
      --bg: #fbf9fe;
      --text: #45454f;
      --muted: #8f8f97;
      --line: rgba(69, 69, 79, 0.14);
      --lilac: #a874dc;
      --blue: #5b8bec;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      background-image:
        radial-gradient(60% 45% at 8% 6%, rgba(168, 116, 220, 0.30), transparent 70%),
        radial-gradient(45% 55% at 100% 50%, rgba(91, 139, 236, 0.26), transparent 70%),
        radial-gradient(70% 40% at 50% 100%, rgba(137, 180, 255, 0.26), transparent 70%);
      background-attachment: fixed;
      color: var(--text);
      font-family: "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 28px 16px 0;
      color: var(--muted);
      font-size: 14px;
    }
    header .logo { height: 22px; width: auto; color: var(--muted); display: block; }
    header .sep { width: 1px; height: 18px; background: var(--line); }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px 64px;
    }
    .hero { max-width: 640px; width: 100%; text-align: center; }
    .icon {
      width: 108px; height: 108px; border-radius: 26px;
      box-shadow: 0 18px 40px rgba(69, 69, 79, 0.14);
      display: block; margin: 0 auto 36px;
    }
    h1 {
      font-family: "Newsreader", Georgia, serif;
      font-weight: 380;
      font-size: clamp(38px, 7vw, 58px);
      line-height: 1.08;
      letter-spacing: -0.01em;
      margin: 0 0 18px;
    }
    h1 em {
      font-style: italic;
      font-size: 1.12em;
      background: linear-gradient(90deg, var(--lilac), var(--blue));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p.lead {
      font-family: "Newsreader", Georgia, serif;
      font-weight: 380;
      font-size: clamp(19px, 3vw, 23px);
      line-height: 1.45;
      margin: 0 auto 40px;
      max-width: 520px;
    }
    .stores {
      display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
    }
    .store {
      display: inline-flex; align-items: center; gap: 10px;
      min-width: 220px; padding: 14px 22px;
      border-radius: 14px; border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.55);
      color: var(--text); text-decoration: none;
      font-size: 15px; font-weight: 500;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      backdrop-filter: blur(6px);
    }
    .store:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(69, 69, 79, 0.12); background: rgba(255,255,255,0.8); }
    .store svg { width: 22px; height: 22px; flex: none; }
    .store small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); line-height: 1.2; }
    .store span { text-align: left; line-height: 1.2; }
    .store.soon { color: var(--muted); cursor: default; }
    .store.soon:hover { transform: none; box-shadow: none; background: rgba(255,255,255,0.55); }
    footer {
      padding: 0 16px 32px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }
    footer a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); }
    footer a:hover { color: var(--text); }
    footer .dot { margin: 0 8px; }
    @media (max-width: 420px) {
      .store { width: 100%; justify-content: center; }
    }
  </style>
</head>
